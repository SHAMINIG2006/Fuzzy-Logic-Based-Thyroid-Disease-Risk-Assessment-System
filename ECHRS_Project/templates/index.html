<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHRS Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b111e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .dashboard-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        .dashboard-title {
            color: #4ed9f8;
            font-weight: 300;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.8rem;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .section-header {
            color: #4ed9f8;
            font-size: 1.1rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-control {
            background: #161d2b;
            border: 1px solid #2d3748;
            color: #fff;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .form-control:focus {
            background: #1c2536;
            border-color: #4ed9f8;
            color: #fff;
            box-shadow: 0 0 8px rgba(78, 217, 248, 0.3);
        }
        .form-control::placeholder {
            color: #4a5568;
        }
        .btn-predict {
            background-color: #0099e5;
            border: none;
            padding: 14px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-predict:hover {
            background-color: #007bbd;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h2 class="dashboard-title">ThyroidAI Diagnostic Dashboard</h2>
    
    <div class="glass-card">
        <h5 class="section-header">Patient Biomarkers</h5>
        
        <form action="/predict" method="post">
            <input type="text" class="form-control" name="T3" placeholder="T3 Level" required>
            <input type="text" class="form-control" name="TT4" placeholder="TT4 Level" required>
            <input type="text" class="form-control" name="T4U" placeholder="T4U Level" required>
            <input type="text" class="form-control" name="FTI" placeholder="FTI Level" required>
            <input type="text" class="form-control" name="nitrate" placeholder="Environmental Nitrate (0-80)" required>
            <input type="text" class="form-control" name="pollution" placeholder="Pollution Level (0-100)" required>

            <button type="submit" class="btn btn-primary w-100 btn-predict">Calculate Risk Probability</button>
        </form>
    </div>
</div>

</body>
</html>
